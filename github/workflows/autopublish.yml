name: Auto Publish Article

on:
  schedule:
    - cron: '0 8 * * *'  # Runs every day at 8:00 AM UTC
  workflow_dispatch:  # Also allows manual trigger

jobs:
  autopublish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Publish
        run: |
          curl -X GET "https://vet-sphere.vercel.app/api/autopublish" \
            -H "Content-Type: application/json"
